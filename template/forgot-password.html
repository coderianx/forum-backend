<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f7fa; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f7fa; padding:40px 0;">
    <tr>
        <td align="center">
            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:400px; background-color:#ffffff; border-radius:12px; padding:32px 24px;">
                <tr>
                    <td style="font-size:20px; color:#111827;">
                        Merhaba, <strong>{{.Username}}</strong>
                    </td>
                </tr>
                <tr>
                    <td style="font-size:14px; color:#6b7280; line-height:1.5; padding-top:8px; padding-bottom:20px;">
                        Şifreni sıfırlamak için aşağıdaki 6 haneli kodu kullan.
                    </td>
                </tr>
                <tr>
                    <td style="background-color:#f9fafb; border-radius:8px; padding:16px; text-align:center;">
                        <span style="font-size:32px; font-weight:600; letter-spacing:8px; color:#111827;">{{.Code}}</span>
                        <br>
                        <span style="font-size:11px; color:#9ca3af; letter-spacing:1px; text-transform:uppercase;">Doğrulama Kodu</span>
                    </td>
                </tr>
                <tr>
                    <td style="font-size:13px; color:#6b7280; line-height:1.5; padding-top:16px;">
                        Bu kodu kimseyle paylaşma.
                    </td>
                </tr>
                <tr>
                    <td style="height:1px; background:#e5e7eb; margin:16px 0; padding:0;"></td>
                </tr>
                <tr>
                    <td style="font-size:12px; color:#9ca3af; line-height:1.5; padding-top:12px;">
                        Eğer bu isteği sen yapmadıysan bu emaili görmezden gelebilirsin.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
