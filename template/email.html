<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Doğrulama</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f7fa; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f7fa; padding:20px 0;">
        <tr>
            <td align="center">
                <table width="100%" max-width="420" cellpadding="0" cellspacing="0" border="0" style="max-width:420px; background-color:#ffffff; border-radius:16px; padding:40px 28px 36px; box-shadow: 0 2px 12px rgba(0,0,0,0.03);">
                    <tr>
                        <td>
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="font-size:22px; font-weight:500; color:#111827; padding-bottom:4px;">
                                        Merhaba, <strong style="font-weight:600; color:#1f2937;">{{.Username}}</strong>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="font-size:15px; color:#4b5563; line-height:1.6; padding-top:6px; padding-bottom:24px;">
                                        Email adresini doğrulamak için aşağıdaki 6 haneli kodu kullan.
                                    </td>
                                </tr>
                            </table>
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6; border-radius:12px; border:1px solid #e5e7eb; margin-bottom:28px;">
                                <tr>
                                    <td style="padding:24px 12px 20px; text-align:center;">
                                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" style="font-size:38px; font-weight:500; letter-spacing:6px; color:#111827; font-feature-settings:'tnum'; white-space:nowrap; word-break:keep-all;">
                                                    {{.Code}}
                                                </td>
                                            </tr>
                                        </table>
                                        <span style="display:block; font-size:11px; font-weight:500; color:#6b7280; letter-spacing:1px; text-transform:uppercase; margin-top:8px;">
                                            Doğrulama Kodu
                                        </span>
                                    </td>
                                </tr>
                            </table>
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="font-size:14px; color:#4b5563; line-height:1.6; padding-bottom:22px;">
                                        <strong style="color:#1f2937; font-weight:600;">Güvenlik uyarısı:</strong> Bu kodu kimseyle paylaşma.
                                    </td>
                                </tr>
                            </table>
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="height:1px; background:#e5e7eb;"></td>
                                </tr>
                            </table>

                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="font-size:13px; color:#6b7280; line-height:1.5; padding-top:18px;">
                                        Eğer bu isteği sen yapmadıysan bu emaili görmezden gelebilirsin.
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
